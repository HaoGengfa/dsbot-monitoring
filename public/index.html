<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot 团队实时看板</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Bot 团队实时看板</h1>
      <span class="sub">谁在干活 · 谁给谁派活 · 谁在回话</span>
    </div>
    <div class="stats">
      <span class="stat"><b id="stat-working">0</b> 干活中</span>
      <span class="stat"><b id="stat-queued">0</b> 排队</span>
      <span class="stat"><b id="stat-total">0</b> 成员</span>
      <span class="stat"><b id="stat-events">0</b> 事件</span>
      <a class="nav-link" href="./replay.html">复盘回放 →</a>
      <a class="nav-link" href="./stage.html">新版布局 →</a>
      <span id="conn" class="conn">连接中…</span>
    </div>
  </header>

  <main id="stage" class="stage">
    <svg id="edges" class="edges" aria-hidden="true"></svg>
    <div id="cards" class="cards"></div>
    <svg id="fx" class="fx" aria-hidden="true"></svg>
  </main>

  <div class="legend">
    <span><i class="dot dispatch"></i>派活</span>
    <span><i class="dot reply"></i>回执</span>
    <span><i class="dot busy"></i>干活中</span>
    <span><i class="line"></i>常驻链路</span>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
